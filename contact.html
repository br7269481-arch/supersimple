<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - GREEN PASTURES LIVESTOCK FARM</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header><!-- Same --></header>

  <main>
    <section class="section">
      <div class="container">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; margin-top: 2rem;">
          <div>
            <h1 class="section-title">Get In Touch</h1>
            <p style="margin-bottom: 3rem;">Ready to place an order or have questions? Contact our farm team.</p>

            <div style="display: grid; gap: 2rem;">
              <div style="display: flex; gap: 1rem; align-items: center;">
                <i class="fas fa-envelope" style="font-size: 2rem; color: var(--green);"></i>
                <div>
                  <h3>Email</h3>
                  <a href="mailto:livestockgreenfarmin@gmail.com">livestockfarmgreenpastures@gmail.com</a>
                </div>
              </div>
              <div style="display: flex; gap: 1rem; align-items: center;">
                <i class="fas fa-phone" style="font-size: 2rem; color: var(--green);"></i>
               <div>
                <h3>phone</h3>
                <a href="+1 707-739-4179">1 707-739-4179</a>
               </div>   
              </div>
              <div style="display: flex; gap: 1rem; align-items: center;">
               
               <i class="fas fa-map-marker-alt" style="font-size: 2rem; color: var(--green);"></i>
                <div>
                  <h3>Location</h3>
                  <p>Farm 21975 N Devils Washboard Rd, <br>Clark, MO 65243</p>
                </div>
              </div>
            </div>
          </div>

          <div>
            <h2 style="margin-bottom: 2rem;">Send Message</h2>
            <form id="contact-form">
              <input type="text" placeholder="Your Name" name="name" required>
              <input type="email" placeholder="Your Email" name="email" required>
              <textarea placeholder="Your Message" name="message" rows="5" required></textarea>
              <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
          </div>
        </div>

        <div class="map-container">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3305.123456789!2d-95.123456789!3d29.123456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8644b6ab1a2c9f1d%3A0x8e4b4e4b4e4b4e4b!2sFarm%20Location!5e0!3m2!1sen!2sus!4v1720000000000" 
                  width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer><!-- Same --></footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/main.js" defer></script>
  <script>
    // Contact form EmailJS (different template)
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // Implement EmailJS send similar to cart
      alert('Message sent! We'll respond soon.');
    });
  </script>
</body>
</html>
