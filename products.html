<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Pastures Livestock Farm</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f8f2;
    }

    h1 {
        text-align: center;
        background: green;
        color: white;
        padding: 20px;
        margin: 0;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        text-align: center;
        transition: transform 0.3s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

    .card h3 {
        margin: 10px 0;
    }

    .card p {
        color: #444;
    }

    button {
        background: green;
        color: white;
        border: none;
        padding: 10px 15px;
        margin: 10px;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: darkgreen;
    }

    .cart {
        background: white;
        margin: 20px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .cart-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #ddd;
    }
</style>
</head>
<body>

<h1>GREEN PASTURES LIVESTOCK FARM</h1>

<div class="container" id="products"></div>

<div class="cart">
    <h2>🛒 Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: $<span id="total">0</span></h3>

    <button onclick="placeOrder()">Place Order</button>

</div>

<script>
const products = [
    {
        name: "Ducks",
        price: 25,
       image : "duck.jpg.jpg"
    },
    {
        name: "Peacock",
        price: 250,
        image : "peacock.jpg.jpg"
    },
    {
        name: "Goats",
        price: 150,
        image: "goat.jpg.jpg"
    },
    {
        name: "Chickens",
        price: 50,
        image: "cock.jpg.jpg"
    },
    {
        name: "Emus",
        price: 350,
        image: "emus.jpg.jpg"
    },
    {
        name: "Geese",
        price: 35,
        image: "geese.jpg"
    },
   {
        name: "Mandarin duck",
        price: 30,
        image: "mandarinduck.jpg"
    },
    {
        name: "Ostrich",
        price: 400,
        image: "ostrich.jpg.jpg"
    },
    {
        name: "Guinea Fowl",
        price: 35,
        image: "guineafowl.jpg.jpg"
    },
   {
        name: "Pheasan",
        price: 120,
        image: "pheasan.jpg"
    },
    {
        name: "Guinea pig",
        price: 40,
        image: "guineapig.jpg.jpg"
    },
    {
        name: "Rabbits",
        price: 60,
        image: "https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308"
    },
    {
        name: "Parrots",
        price: 400,
        image: "https://images.unsplash.com/photo-1555169062-013468b47731"
    },
    {
        name: "Turkeys",
        price: 70,
        image: "turkey.jpg.jpg"
    },
    {
        name: "Donkeys",
        price: 800,
        image: "donkey.jpg.jpg"
    },
    {
        name: "Chicken Coop",
        price: 500,
        image: "chickencoop.jpg.jpg"
    }
];

let cart = {};

function displayProducts() {
    const container = document.getElementById("products");

    products.forEach((product, index) => {
        container.innerHTML += `
            <div class="card">
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p>Price: $${product.price}</p>
                <button onclick="addToCart(${index})">Add To Cart</button>
            </div>
        `;
    });
}

function addToCart(index) {
    const product = products[index];

    if (!cart[product.name]) {
        cart[product.name] = {
            price: product.price,
            quantity: 0
        };
    }

    cart[product.name].quantity++;
    updateCart();
}

function updateCart() {
    let cartDiv = document.getElementById("cartItems");
    let totalSpan = document.getElementById("total");

    cartDiv.innerHTML = "";
    let total = 0;

    for (let item in cart) {
        let itemTotal = cart[item].price * cart[item].quantity;
        total += itemTotal;

        cartDiv.innerHTML += `
            <div class="cart-item">
                ${item} x${cart[item].quantity} = $${itemTotal}
                <div>
                    <button onclick="decreaseItem('${item}')">-</button>
                    <button onclick="removeItem('${item}')">Delete</button>
                </div>
            </div>
        `;
    }

    totalSpan.innerText = total;
}
function placeOrder() {
    if (Object.keys(cart).length === 0) {
        alert("Your cart is empty!");
        return;
    }

    let orderDetails = "GREEN PASTURES LIVESTOCK FARM ORDER\n\n";
    let total = 0;

    for (let item in cart) {
        let quantity = cart[item].quantity;
        let price = cart[item].price;
        let itemTotal = price * quantity;

        orderDetails += `${item} x${quantity} = $${itemTotal}\n`;
        total += itemTotal;
    }

    orderDetails += `\nTotal: $${total}\n`;
    orderDetails += "\nCustomer Details:\nName:\nPhone:\nLocation:\n";

    let subject = "New Livestock Order";
    let mailtoLink = `mailto:livestockfarmgreenpastures@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(orderDetails)}`;

    window.location.href = mailtoLink;
}

function decreaseItem(item) {
    if (cart[item].quantity > 1) {
        cart[item].quantity--;
    } else {
        delete cart[item];
    }
    updateCart();
}

function removeItem(item) {
    delete cart[item];
    updateCart();
}

displayProducts();
</script>

</body>
</html>
